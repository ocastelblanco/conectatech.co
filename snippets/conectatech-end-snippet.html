<script>
  /********* AÑADE CLASES AL <BODY> DE UN CURSO SEGÚN EL ÁRBOL CURRICULAR - GENERAL ***********/
  /* CT:MAP:START */
  const CT_COURSES = { "29": ["cosmovision-cristiana", "matematicas"], "37": ["cosmovision-cristiana", "ciencias-naturales"], "49": ["cosmovision-cristiana", "ciencias-sociales"], "59": ["cosmovision-cristiana", "quimica"], "71": ["cosmovision-cristiana", "fisica"], "30": ["cosmovision-cristiana", "matematicas"], "38": ["cosmovision-cristiana", "ciencias-naturales"], "50": ["cosmovision-cristiana", "ciencias-sociales"], "60": ["cosmovision-cristiana", "quimica"], "73": ["cosmovision-cristiana", "fisica"], "31": ["cosmovision-cristiana", "matematicas"], "52": ["cosmovision-cristiana", "ciencias-naturales"], "61": ["cosmovision-cristiana", "quimica"], "72": ["cosmovision-cristiana", "fisica"], "76": ["cosmovision-cristiana", "ciencias-sociales"], "32": ["cosmovision-cristiana", "matematicas"], "53": ["cosmovision-cristiana", "ciencias-naturales"], "62": ["cosmovision-cristiana", "quimica"], "68": ["cosmovision-cristiana", "fisica"], "78": ["cosmovision-cristiana", "ciencias-sociales"], "35": ["cosmovision-cristiana", "matematicas"], "63": ["cosmovision-cristiana", "quimica"], "66": ["cosmovision-cristiana", "fisica"], "36": ["cosmovision-cristiana", "matematicas"], "64": ["cosmovision-cristiana", "quimica"], "67": ["cosmovision-cristiana", "fisica"], "33": ["planeta-lector", "cuaderno-de-besos"], "39": ["cosmovision-cristiana", "ciencias-naturales"], "40": ["cosmovision-cristiana", "matematicas"], "48": ["cosmovision-cristiana", "ciencias-sociales"], "41": ["cosmovision-cristiana", "ciencias-naturales"], "42": ["cosmovision-cristiana", "matematicas"], "43": ["cosmovision-cristiana", "matematicas"], "44": ["cosmovision-cristiana", "matematicas"], "45": ["cosmovision-cristiana", "matematicas"], "46": ["cosmovision-cristiana", "matematicas"] };
  /* CT:MAP:END */
  const bodyElement = document.querySelector("body");
  if (bodyElement !== null) {
    bodyElement.classList.forEach(clase => {
      const m = clase.match(/^course-(\d+)$/);
      if (m && CT_COURSES[m[1]]) bodyElement.classList.add(...CT_COURSES[m[1]]);
    });
  }
  /********** DEFINE CONSTANTES GENERALES ********/
  // Los niveles y los cursos que los componen
  const niveles = [
    { nombre: 'primaria', cursos: ['1', '2', '3', '4', '5'] },
    { nombre: 'secundaria', cursos: ['6', '7', '8', '9'] },
    { nombre: 'media', cursos: ['10', '11'] }
  ];

  /********** DEFINE EL TIPO DE PROYECTO ********/
  let proyecto = null;
  if (bodyElement.classList.contains('planeta-lector')) proyecto = 'planeta-lector';
  if (bodyElement.classList.contains('cosmovision-cristiana')) proyecto = 'cosmovision-cristiana';

  /********* MODIFICA EL HEADER DE CADA CURSO ***********/
  const courseHeaderImageElement = document.querySelector("#courseheaderimage");
  if (courseHeaderImageElement !== null) {
    const tituloCursoElement = courseHeaderImageElement.querySelector(".page-header-headings > *");
    if (proyecto == 'cosmovision-cristiana') generaDivGrado(tituloCursoElement, courseHeaderImageElement);
    if (proyecto == 'planeta-lector') generaDivGrado(tituloCursoElement, courseHeaderImageElement, false);
  }

  /********* MODIFICA CONTENIDOS ESPECÍFICOS DE CADA CURSO ***********/
  if (proyecto == 'planeta-lector') {
    // Procesa elementos con <figure>
    const caratulaLibro = document.querySelector('.caratula-libro');
    const quienEscribio = document.querySelector('.quien-escribio-este-libro');
    modificaConFigure(caratulaLibro);
    modificaConFigure(quienEscribio);
  }
  function modificaConFigure(elemento) {
    if (!elemento) return;
    const textosDiv = document.createElement('div');
    textosDiv.classList.add('textos');
    const parrafos = elemento.querySelectorAll(':scope > p');
    parrafos.forEach(p => textosDiv.appendChild(p));
    if (textosDiv.children.length > 0) elemento.appendChild(textosDiv);
  }

  /********* MODIFICA LA CARD DE CADA CURSO (MIS CURSOS) ***********/
  function procesarCards() {
    // Seleccionar todas las cards de curso dentro de .card-grid (para limitar)
    const cardGrids = document.querySelectorAll('.card-grid');
    if (!cardGrids.length) return;
    cardGrids.forEach(grid => {
      const cards = grid.querySelectorAll('.card.course-card');
      cards.forEach(cardCurso => {
        // Elemento de texto:
        //   Mis Cursos   → span.multiline > span[aria-hidden="true"]  (safe: solo el texto visible)
        //   Página Principal → a.coursename directamente (texto + span.visually-hidden;
        //                      generaDivGrado maneja el salto de línea en extraeMateriaCurso)
        const textoElement = cardCurso.querySelector('.coursename span.multiline > span[aria-hidden="true"]')
          ?? cardCurso.querySelector('.coursename span.multiline > span:last-of-type')
          ?? cardCurso.querySelector('a.coursename');
        if (!textoElement) return;

        // Enlace del curso para extraer el ID (nunca el <a> de la imagen)
        const anchorCurso = cardCurso.querySelector('a.coursename, a[href*="course/view.php"]');
        if (!anchorCurso) return;

        const hrefParts = anchorCurso.href.split('?');
        if (hrefParts.length < 2) return;
        const cursoID = hrefParts[1].replace(/id=/g, '');

        const proyecto = CT_COURSES[cursoID] ? CT_COURSES[cursoID][0] : null;
        const cardCursoTop = cardCurso.querySelector('.card-img-top');

        if (proyecto == 'cosmovision-cristiana') generaDivGrado(textoElement, cardCursoTop);
        if (proyecto == 'planeta-lector') generaDivGrado(textoElement, cardCursoTop, false);
      });
    });
  }
  // Observar cambios en el DOM para detectar cuando se agregan cards
  const observer = new MutationObserver(function (mutations) {
    procesarCards();
  });
  // Iniciar observación en el body, pero filtrando por si hay un contenedor más específico
  // Observamos todo el documento, pero podemos restringir a un contenedor principal si se desea
  const targetNode = document.querySelector('body');
  if (targetNode) {
    observer.observe(targetNode, {
      childList: true,
      subtree: true
    });
  }

  // Ejecutar una vez al inicio por si las cards ya están presentes
  procesarCards();

  /********* FUNCIONES PARA COSMOVISIÓN CRISTIANA ***********/
  function extraeMateriaCurso(nombre) {
    [materia, grado] = nombre.split(' - ');
    if (materia.match(/\n/g)) materia = materia.split('\n')[1];
    if (materia && grado && grado.substr(0, 1).match(/\d/g)) {
      const salida = [materia.trim(), grado.trim()];
      return salida;
    }
    return null;
  }

  function generaDivGrado(tituloCursoElement, padre, addGrado = true) {
    if (!padre || padre.querySelector('.grado')) return;
    const tituloCurso = tituloCursoElement.innerText.trim();
    if (!tituloCurso) return;
    const datos = extraeMateriaCurso(tituloCurso);
    if (datos) {
      [materia, grado] = datos;
      let nivel = null;
      niveles.forEach((etapa) => {
        if (etapa.cursos.includes(grado)) nivel = etapa.nombre;
      });
      bodyElement.classList.add('grado-' + grado);
      if (nivel) bodyElement.classList.add(nivel);
      tituloCursoElement.innerText = materia;
      if (addGrado) {
        const gradoElement = document.createElement("div");
        gradoElement.innerText = grado;
        gradoElement.classList.add("grado");
        padre.prepend(gradoElement);
      }
    }
  }

  // ************* ConectaTech — Presaberes Interactive Quiz v1.0 ****************************
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('[data-quiz-block]').forEach(function (block) {
      block.addEventListener('change', function (e) {
        if (!e.target.matches('input[type="radio"]')) return;
        var selected = e.target.closest('.respuesta-option');
        var feedback = block.querySelector('.retroalimentacion');
        var allOptions = block.querySelectorAll('.respuesta-option');
        var type = selected.dataset.type;
        var feedbackText = selected.dataset.feedback;
        allOptions.forEach(function (opt) {
          opt.classList.remove('bg-success', 'bg-danger', 'border-success', 'border-danger', 'text-white');
          opt.classList.add('border-light');
          opt.querySelector('input').disabled = true;
          opt.querySelector('label').style.cursor = 'default';
        });
        selected.classList.remove('border-light');
        if (type === 'correct') {
          selected.classList.add('bg-success', 'border-success', 'text-white');
        } else {
          selected.classList.add('bg-danger', 'border-danger', 'text-white');
        }
        selected.querySelectorAll('label, span').forEach(function (el) { el.style.color = '#fff'; });
        var emoji = type === 'correct' ? '✅' : '❌';
        var alertType = type === 'correct' ? 'success' : 'warning';
        var label = type === 'correct' ? '¡Excelente!' : 'Incorrecto';
        feedback.innerHTML =
          '<div class="alert alert-' + alertType + ' d-flex align-items-start shadow-sm" role="alert">' +
          '<div class="mr-3 mt-1" style="font-size:1.5rem">' + emoji + '</div>' +
          '<div><strong>' + label + '</strong>' +
          '<p class="mb-0 mt-1">' + feedbackText + '</p></div></div>';
        feedback.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });
  });
</script>
