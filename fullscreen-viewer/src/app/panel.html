<div class="scroll" #scroller tabindex="-1">
  <!-- Mismo envoltorio que usa Moodle: los estilos de snippets/ se anclan a estas clases. -->
  <article class="section-item">
    <h2 class="sectionname">{{ subtema().titulo }}</h2>
    <div class="activity-item">
      @for (bloque of subtema().bloques; track $index) {
        <div class="bloque" [innerHTML]="bloque"></div>
      }
    </div>
  </article>
</div>

<nav class="navegacion" aria-label="Navegar entre subtemas">
  <button type="button" class="paso" [disabled]="posicion() === 0" (click)="anterior.emit()">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path
        d="M15 5l-7 7 7 7"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span>Anterior</span>
  </button>
  <span class="contador" aria-live="polite">{{ posicion() + 1 }} de {{ total() }}</span>
  <button
    type="button"
    class="paso"
    [disabled]="posicion() === total() - 1"
    (click)="siguiente.emit()"
  >
    <span>Siguiente</span>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path
        d="M9 5l7 7-7 7"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</nav>
